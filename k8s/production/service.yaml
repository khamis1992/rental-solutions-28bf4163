apiVersion: v1
kind: Service
metadata:
  name: rental-solutions-api-service
  namespace: rental-solutions
  labels:
    app: rental-solutions-api
    tier: backend
    environment: production
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "http"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: "/health"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-interval: "30"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-timeout: "5"
    service.beta.kubernetes.io/aws-load-balancer-healthy-threshold: "2"
    service.beta.kubernetes.io/aws-load-balancer-unhealthy-threshold: "3"
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: rental-solutions-api
    tier: backend
  sessionAffinity: None

---
apiVersion: v1
kind: Service
metadata:
  name: rental-solutions-web-service
  namespace: rental-solutions
  labels:
    app: rental-solutions-web
    tier: frontend
    environment: production
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "http"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: "/health"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-interval: "30"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-timeout: "5"
    service.beta.kubernetes.io/aws-load-balancer-healthy-threshold: "2"
    service.beta.kubernetes.io/aws-load-balancer-unhealthy-threshold: "3"
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  - port: 443
    targetPort: 80
    protocol: TCP
    name: https
  selector:
    app: rental-solutions-web
    tier: frontend
  sessionAffinity: None

---
apiVersion: v1
kind: Service
metadata:
  name: rental-solutions-api-internal
  namespace: rental-solutions
  labels:
    app: rental-solutions-api
    tier: backend
    environment: production
    service-type: internal
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: rental-solutions-api
    tier: backend

---
apiVersion: v1
kind: Service
metadata:
  name: rental-solutions-web-internal
  namespace: rental-solutions
  labels:
    app: rental-solutions-web
    tier: frontend
    environment: production
    service-type: internal
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: rental-solutions-web
    tier: frontend 