# Production Deployment Configuration - Day 10
# Qatar Rental Solutions Platform - Production Launch

apiVersion: v1
kind: Namespace
metadata:
  name: rental-production
  labels:
    environment: production
    region: qatar
    app: rental-solutions

---
# Blue Environment Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rental-app-blue
  namespace: rental-production
  labels:
    app: rental-app
    environment: blue
    version: v1.0.0
spec:
  replicas: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 2
  selector:
    matchLabels:
      app: rental-app
      environment: blue
  template:
    metadata:
      labels:
        app: rental-app
        environment: blue
        version: v1.0.0
    spec:
      containers:
      - name: rental-app
        image: rental-solutions:v1.0.0
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 8443
          name: https
        env:
        - name: NODE_ENV
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: url
        - name: SUPABASE_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: supabase-url
        - name: SUPABASE_ANON_KEY
          valueFrom:
            secretKeyRef:
              name: supabase-credentials
              key: anon-key
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: url
        - name: TIMEZONE
          value: "Asia/Qatar"
        - name: LOCALE
          value: "ar-QA"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: app-config
          mountPath: /app/config
          readOnly: true
        - name: ssl-certs
          mountPath: /app/ssl
          readOnly: true
      volumes:
      - name: app-config
        configMap:
          name: app-config
      - name: ssl-certs
        secret:
          secretName: ssl-certificates
      nodeSelector:
        node-type: application
      tolerations:
      - key: "app-workload"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"

---
# Green Environment Deployment (for Blue-Green deployment)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rental-app-green
  namespace: rental-production
  labels:
    app: rental-app
    environment: green
    version: v1.0.1
spec:
  replicas: 0  # Initially scaled to 0
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 2
  selector:
    matchLabels:
      app: rental-app
      environment: green
  template:
    metadata:
      labels:
        app: rental-app
        environment: green
        version: v1.0.1
    spec:
      containers:
      - name: rental-app
        image: rental-solutions:v1.0.1
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 8443
          name: https
        env:
        - name: NODE_ENV
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: url
        - name: SUPABASE_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: supabase-url
        - name: SUPABASE_ANON_KEY
          valueFrom:
            secretKeyRef:
              name: supabase-credentials
              key: anon-key
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: url
        - name: TIMEZONE
          value: "Asia/Qatar"
        - name: LOCALE
          value: "ar-QA"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: app-config
          mountPath: /app/config
          readOnly: true
        - name: ssl-certs
          mountPath: /app/ssl
          readOnly: true
      volumes:
      - name: app-config
        configMap:
          name: app-config
      - name: ssl-certs
        secret:
          secretName: ssl-certificates
      nodeSelector:
        node-type: application

---
# Blue Service
apiVersion: v1
kind: Service
metadata:
  name: rental-app-blue-service
  namespace: rental-production
  labels:
    app: rental-app
    environment: blue
spec:
  selector:
    app: rental-app
    environment: blue
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: https
    port: 443
    targetPort: 8443
    protocol: TCP
  type: ClusterIP

---
# Green Service
apiVersion: v1
kind: Service
metadata:
  name: rental-app-green-service
  namespace: rental-production
  labels:
    app: rental-app
    environment: green
spec:
  selector:
    app: rental-app
    environment: green
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: https
    port: 443
    targetPort: 8443
    protocol: TCP
  type: ClusterIP

---
# Production Service (Active)
apiVersion: v1
kind: Service
metadata:
  name: rental-app-production
  namespace: rental-production
  labels:
    app: rental-app
    environment: production
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "http"
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "arn:aws:acm:me-south-1:123456789012:certificate/12345678-1234-1234-1234-123456789012"
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "https"
spec:
  selector:
    app: rental-app
    environment: blue  # Initially points to blue
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: https
    port: 443
    targetPort: 8443
    protocol: TCP
  type: LoadBalancer

---
# Horizontal Pod Autoscaler for Blue
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rental-app-blue-hpa
  namespace: rental-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rental-app-blue
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 4
        periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60

---
# Horizontal Pod Autoscaler for Green
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rental-app-green-hpa
  namespace: rental-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rental-app-green
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
# ConfigMap for Application Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: rental-production
data:
  supabase-url: "https://your-project.supabase.co"
  redis-host: "redis-cluster.rental-production.svc.cluster.local"
  redis-port: "6379"
  app-name: "Qatar Rental Solutions"
  app-version: "1.0.0"
  timezone: "Asia/Qatar"
  locale: "ar-QA"
  log-level: "info"
  max-upload-size: "10MB"
  session-timeout: "3600"
  rate-limit-requests: "1000"
  rate-limit-window: "900"

