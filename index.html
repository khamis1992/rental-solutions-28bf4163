    <!-- تحسينات CSS للجوال -->
    <style>
      /* مؤشر التحميل الأولي للجوال */
      .initial-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      
      .loader-content {
        text-align: center;
        max-width: 300px;
        padding: 20px;
      }
      
      .loader-logo {
        width: 80px;
        height: 80px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        margin: 0 auto 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        animation: pulse 2s infinite;
      }
      
      .loader-text {
        font-size: 18px;
        margin-bottom: 10px;
        font-weight: 600;
      }
      
      .loader-subtext {
        font-size: 14px;
        opacity: 0.8;
        margin-bottom: 30px;
      }
      
      .progress-bar {
        width: 100%;
        height: 4px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 20px;
      }
      
      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #fbbf24, #f59e0b);
        border-radius: 2px;
        width: 0%;
        animation: loading 3s ease-out forwards;
      }
      
      .loading-tips {
        font-size: 12px;
        opacity: 0.7;
        line-height: 1.4;
      }
      
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.8; }
      }
      
      @keyframes loading {
        0% { width: 0%; }
        30% { width: 30%; }
        60% { width: 70%; }
        100% { width: 100%; }
      }
      
      /* إخفاء المؤشر عند التحميل */
      .loaded .initial-loader {
        opacity: 0;
        transform: scale(1.1);
        transition: all 0.5s ease;
        pointer-events: none;
      }
      
      /* تحسينات الخطوط للجوال */
      @font-face {
        font-family: 'Noto Sans Arabic';
        font-display: swap;
        font-weight: 400;
        src: local('Noto Sans Arabic'), local('NotoSansArabic-Regular');
      }
      
      /* CSS تحسينات أولية للجوال */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      
      html {
        -webkit-text-size-adjust: 100%;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      body {
        font-family: 'Noto Sans Arabic', -apple-system, BlinkMacSystemFont, sans-serif;
        line-height: 1.6;
        color: #1f2937;
        background: #ffffff;
      }
      
      /* تحسين الأداء للجوال */
      @media (max-width: 768px) {
        body {
          font-size: 14px;
          touch-action: manipulation;
          -webkit-overflow-scrolling: touch;
        }
        
        input, select, textarea {
          font-size: 16px; /* منع zoom في iOS */
        }
      }
    </style>

    <!-- Service Worker Registration - DISABLED -->
    <script>
      // PWA Service Worker registration has been disabled
      console.log('[PWA] Service Worker registration disabled');
      
      // Handle offline/online status with mobile optimizations
      function updateOnlineStatus() {
        const isOnline = navigator.onLine;
        document.body.classList.toggle('offline', !isOnline);
        
        // إضافة مؤشر بصري للجوال
        const statusIndicator = document.createElement('div');
        statusIndicator.id = 'connection-status';
        statusIndicator.style.cssText = `
          position: fixed;
          top: 0;
          left: 50%;
          transform: translateX(-50%);
          background: ${isOnline ? '#10b981' : '#ef4444'};
          color: white;
          padding: 4px 12px;
          border-radius: 0 0 8px 8px;
          font-size: 12px;
          z-index: 10000;
          transition: transform 0.3s ease;
          transform: translateX(-50%) ${isOnline ? 'translateY(-100%)' : 'translateY(0)'};
        `;
        statusIndicator.textContent = isOnline ? 'متصل' : 'غير متصل';
        
        // إزالة المؤشر السابق وإضافة الجديد
        const existing = document.getElementById('connection-status');
        if (existing) existing.remove();
        if (!isOnline) document.body.appendChild(statusIndicator);
        
        // Dispatch custom event
        window.dispatchEvent(new CustomEvent('connection-changed', { 
          detail: { online: isOnline } 
        }));
      }
      
      // تحسينات خاصة بالجوال
      function initMobileOptimizations() {
        // تحسين اللمس للجوال
        document.addEventListener('touchstart', function() {}, { passive: true });
        
        // منع zoom عند النقر المزدوج
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function (event) {
          const now = (new Date()).getTime();
          if (now - lastTouchEnd <= 300) {
            event.preventDefault();
          }
          lastTouchEnd = now;
        }, false);
        
        // تحسين الأداء للجوال
        if ('requestIdleCallback' in window) {
          requestIdleCallback(() => {
            // تحميل الموارد غير الضرورية في وقت الخمول
            console.log('🔧 تحسين الأداء للجوال مفعل');
          });
        }
        
        // مراقبة استخدام الذاكرة للجوال
        if (performance.memory) {
          const memoryInfo = performance.memory;
          const usedMB = Math.round(memoryInfo.usedJSHeapSize / 1024 / 1024);
          console.log(`📱 ذاكرة مستخدمة: ${usedMB}MB`);
        }
      }
      
      window.addEventListener('online', updateOnlineStatus);
      window.addEventListener('offline', updateOnlineStatus);
      window.addEventListener('load', initMobileOptimizations);
      updateOnlineStatus();
      
      // إخفاء مؤشر التحميل عند اكتمال تحميل التطبيق  
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loader = document.getElementById('initialLoader');
          if (loader) {
            document.body.classList.add('loaded');
            setTimeout(() => {
              loader.style.display = 'none';
            }, 500);
          }
        }, 1000);
      });
    </script>
