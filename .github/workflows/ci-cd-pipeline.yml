name: Rental Solutions CI/CD Pipeline

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * 1' # Weekly security scan

env:
  REGISTRY: registry.rental-solutions.com
  NODE_VERSION: '20'
  ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || github.ref == 'refs/heads/staging' && 'staging' || 'development' }}
  QATAR_REGION: me-south-1
  CLUSTER_NAME: rental-solutions-qatar

jobs:
  # Code Quality and Security Analysis
  code-analysis:
    name: Code Quality & Security Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install Dependencies
      run: |
        npm ci
        npm audit --audit-level moderate

    - name: Run ESLint
      run: npm run lint

    - name: Run TypeScript Check
      run: npm run type-check

    - name: Run Security Scan
      run: |
        npm run security:scan
        npm audit --audit-level high

    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    - name: OWASP Dependency Check
      uses: dependency-check/Dependency-Check_Action@main
      with:
        project: 'rental-solutions'
        path: '.'
        format: 'HTML'

  # Unit and Integration Tests
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: code-analysis
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: rental_solutions_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Setup Test Database
      run: |
        npm run db:migrate:test
        npm run db:seed:test
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/rental_solutions_test

    - name: Run Unit Tests
      run: npm run test:unit
      env:
        NODE_ENV: test
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/rental_solutions_test
        REDIS_URL: redis://localhost:6379

    - name: Run Integration Tests
      run: npm run test:integration
      env:
        NODE_ENV: test
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/rental_solutions_test
        REDIS_URL: redis://localhost:6379

    - name: Generate Test Coverage
      run: npm run test:coverage

    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage/lcov.info
        flags: unittests
        name: rental-solutions-coverage

  # End-to-End Tests
  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Build Application
      run: npm run build

    - name: Start Application
      run: |
        npm run start:test &
        sleep 30
      env:
        NODE_ENV: test
        PORT: 3000

    - name: Run E2E Tests
      run: npm run test:e2e
      env:
        BASE_URL: http://localhost:3000

    - name: Upload E2E Test Results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: e2e-test-results
        path: e2e-test-results/

  # Build Docker Images
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test, e2e-tests]
    if: github.event_name == 'push'
    
    outputs:
      api-image: ${{ steps.meta-api.outputs.tags }}
      web-image: ${{ steps.meta-web.outputs.tags }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}

    - name: Extract API Metadata
      id: meta-api
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/rental-solutions/api
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and Push API Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile.api
        push: true
        tags: ${{ steps.meta-api.outputs.tags }}
        labels: ${{ steps.meta-api.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64
        build-args: |
          NODE_ENV=production
          BUILD_DATE=${{ github.event.head_commit.timestamp }}
          VCS_REF=${{ github.sha }}

    - name: Extract Web Metadata
      id: meta-web
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/rental-solutions/web
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and Push Web Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile.web
        push: true
        tags: ${{ steps.meta-web.outputs.tags }}
        labels: ${{ steps.meta-web.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64
        build-args: |
          NODE_ENV=production
          BUILD_DATE=${{ github.event.head_commit.timestamp }}
          VCS_REF=${{ github.sha }}

    - name: Run Container Security Scan
      run: |
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
          aquasec/trivy image --severity HIGH,CRITICAL \
          ${{ steps.meta-api.outputs.tags }}
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
          aquasec/trivy image --severity HIGH,CRITICAL \
          ${{ steps.meta-web.outputs.tags }}

  # Deploy to Development
  deploy-development:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment: development
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.QATAR_REGION }}

    - name: Update Kubeconfig
      run: |
        aws eks update-kubeconfig --region ${{ env.QATAR_REGION }} --name ${{ env.CLUSTER_NAME }}-dev

    - name: Deploy to Development
      run: |
        sed -i 's|rental-solutions/api:latest|${{ needs.build.outputs.api-image }}|g' k8s/development/*.yaml
        sed -i 's|rental-solutions/web:latest|${{ needs.build.outputs.web-image }}|g' k8s/development/*.yaml
        kubectl apply -f k8s/development/
        kubectl rollout status deployment/rental-solutions-api -n rental-solutions-dev
        kubectl rollout status deployment/rental-solutions-web -n rental-solutions-dev

    - name: Run Smoke Tests
      run: |
        kubectl port-forward service/rental-solutions-api-service 3000:80 -n rental-solutions-dev &
        sleep 10
        npm run test:smoke
      env:
        API_URL: http://localhost:3000

  # Deploy to Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/staging'
    environment: staging
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.QATAR_REGION }}

    - name: Update Kubeconfig
      run: |
        aws eks update-kubeconfig --region ${{ env.QATAR_REGION }} --name ${{ env.CLUSTER_NAME }}-staging

    - name: Deploy to Staging
      run: |
        sed -i 's|rental-solutions/api:latest|${{ needs.build.outputs.api-image }}|g' k8s/staging/*.yaml
        sed -i 's|rental-solutions/web:latest|${{ needs.build.outputs.web-image }}|g' k8s/staging/*.yaml
        kubectl apply -f k8s/staging/
        kubectl rollout status deployment/rental-solutions-api -n rental-solutions-staging
        kubectl rollout status deployment/rental-solutions-web -n rental-solutions-staging

    - name: Run Performance Tests
      run: npm run test:performance
      env:
        TARGET_URL: https://staging.rental-solutions.qa

  # Deploy to Production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.QATAR_REGION }}

    - name: Update Kubeconfig
      run: |
        aws eks update-kubeconfig --region ${{ env.QATAR_REGION }} --name ${{ env.CLUSTER_NAME }}-prod

    - name: Backup Database
      run: |
        kubectl create job --from=cronjob/database-backup manual-backup-$(date +%s) -n rental-solutions
        kubectl wait --for=condition=complete job/manual-backup-$(date +%s) --timeout=600s -n rental-solutions

    - name: Blue-Green Deployment
      run: |
        # Deploy to green environment
        sed -i 's|rental-solutions/api:latest|${{ needs.build.outputs.api-image }}|g' k8s/production/*.yaml
        sed -i 's|rental-solutions/web:latest|${{ needs.build.outputs.web-image }}|g' k8s/production/*.yaml
        
        # Create green deployment
        sed 's/rental-solutions-/rental-solutions-green-/g' k8s/production/deployment.yaml > k8s/production/deployment-green.yaml
        kubectl apply -f k8s/production/deployment-green.yaml
        
        # Wait for green deployment to be ready
        kubectl rollout status deployment/rental-solutions-green-api -n rental-solutions
        kubectl rollout status deployment/rental-solutions-green-web -n rental-solutions
        
        # Run health checks on green environment
        kubectl port-forward service/rental-solutions-green-api-service 3001:80 -n rental-solutions &
        sleep 10
        curl -f http://localhost:3001/health || exit 1
        
        # Switch traffic to green (update service selectors)
        kubectl patch service rental-solutions-api-service -n rental-solutions -p '{"spec":{"selector":{"app":"rental-solutions-green-api"}}}'
        kubectl patch service rental-solutions-web-service -n rental-solutions -p '{"spec":{"selector":{"app":"rental-solutions-green-web"}}}'
        
        # Wait for traffic switch
        sleep 30
        
        # Verify production health
        curl -f https://rental-solutions.qa/health || exit 1
        
        # Clean up old blue deployment
        kubectl delete deployment rental-solutions-api rental-solutions-web -n rental-solutions --ignore-not-found=true
        
        # Rename green to current
        kubectl patch deployment rental-solutions-green-api -n rental-solutions -p '{"metadata":{"name":"rental-solutions-api"}}'
        kubectl patch deployment rental-solutions-green-web -n rental-solutions -p '{"metadata":{"name":"rental-solutions-web"}}'

    - name: Post-Deployment Tests
      run: |
        npm run test:production
        npm run test:load
      env:
        TARGET_URL: https://rental-solutions.qa

    - name: Notify Deployment Success
      uses: 8398a7/action-slack@v3
      with:
        status: success
        text: '🚀 Production deployment successful for commit ${{ github.sha }}'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  # Rollback on Failure
  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: failure() && github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.QATAR_REGION }}

    - name: Update Kubeconfig
      run: |
        aws eks update-kubeconfig --region ${{ env.QATAR_REGION }} --name ${{ env.CLUSTER_NAME }}-prod

    - name: Rollback Deployment
      run: |
        kubectl rollout undo deployment/rental-solutions-api -n rental-solutions
        kubectl rollout undo deployment/rental-solutions-web -n rental-solutions
        kubectl rollout status deployment/rental-solutions-api -n rental-solutions
        kubectl rollout status deployment/rental-solutions-web -n rental-solutions

    - name: Verify Rollback
      run: |
        curl -f https://rental-solutions.qa/health

    - name: Notify Rollback
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        text: '⚠️ Production deployment failed and was rolled back for commit ${{ github.sha }}'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  # Performance Monitoring
  performance-monitoring:
    name: Performance Monitoring
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Run Lighthouse CI
      uses: treosh/lighthouse-ci-action@v9
      with:
        urls: |
          https://rental-solutions.qa
          https://api.rental-solutions.qa/health
        uploadArtifacts: true
        temporaryPublicStorage: true

    - name: Run Load Tests
      run: |
        docker run --rm -i grafana/k6 run --vus 10 --duration 30s - <tests/load-test.js
      env:
        TARGET_URL: https://rental-solutions.qa

  # Security Monitoring
  security-monitoring:
    name: Security Monitoring
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Run OWASP ZAP Baseline Scan
      uses: zaproxy/action-baseline@v0.7.0
      with:
        target: 'https://rental-solutions.qa'
        rules_file_name: '.zap/rules.tsv'

    - name: Upload ZAP Report
      uses: actions/upload-artifact@v3
      with:
        name: zap-report
        path: report_html.html

    - name: Notify Security Team
      if: failure()
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        text: '🔒 Security scan found vulnerabilities in production'
        webhook_url: ${{ secrets.SECURITY_SLACK_WEBHOOK }}    