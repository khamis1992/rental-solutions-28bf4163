name: 🚀 Production Deployment Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      deploy_type:
        description: 'Deployment type'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - frontend-only
          - backend-only

env:
  REGISTRY: registry.rental-solutions.com
  IMAGE_TAG: ${{ github.sha }}
  NAMESPACE: rental-solutions
  
jobs:
  # 📋 Pre-deployment checks
  pre-checks:
    name: 🔍 Pre-deployment Checks
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      deploy_frontend: ${{ steps.check.outputs.deploy_frontend }}
      deploy_backend: ${{ steps.check.outputs.deploy_backend }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Check what to deploy
        id: check
        run: |
          if [[ "${{ github.event.inputs.deploy_type }}" == "frontend-only" ]]; then
            echo "deploy_frontend=true" >> $GITHUB_OUTPUT
            echo "deploy_backend=false" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.inputs.deploy_type }}" == "backend-only" ]]; then
            echo "deploy_frontend=false" >> $GITHUB_OUTPUT
            echo "deploy_backend=true" >> $GITHUB_OUTPUT
          else
            echo "deploy_frontend=true" >> $GITHUB_OUTPUT
            echo "deploy_backend=true" >> $GITHUB_OUTPUT
          fi
          echo "should_deploy=true" >> $GITHUB_OUTPUT

  # 🧪 Quality Assurance
  quality-assurance:
    name: 🧪 Quality Assurance
    runs-on: ubuntu-latest
    needs: pre-checks
    if: needs.pre-checks.outputs.should_deploy == 'true'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 TypeScript check
        run: npm run type-check

      - name: 🎨 ESLint check
        run: npm run lint

      - name: 🧪 Unit tests
        run: npm run test:unit

      - name: 🔗 Integration tests
        run: npm run test:integration

      - name: 🏗️ Build check
        run: npm run build

      - name: 📊 Bundle analysis
        run: npm run analyze

  # 🛡️ Security Scanning
  security-scan:
    name: 🛡️ Security Scanning
    runs-on: ubuntu-latest
    needs: pre-checks
    if: needs.pre-checks.outputs.should_deploy == 'true'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 🔍 Dependency audit
        run: npm audit --audit-level=high

      - name: 🛡️ CodeQL analysis
        uses: github/codeql-action/init@v3
        with:
          languages: typescript, javascript

      - name: 🔧 Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: 🛡️ Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # 🐳 Build Docker Images
  build-images:
    name: 🐳 Build Docker Images
    runs-on: ubuntu-latest
    needs: [quality-assurance, security-scan]
    strategy:
      matrix:
        service: [api, web]
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: 🔧 Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/rental-solutions/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 🐳 Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            VCS_REF=${{ github.sha }}

  # 🌍 Deploy to Staging
  deploy-staging:
    name: 🌍 Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-images
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: 🔐 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: me-south-1

      - name: 🔧 Update kubeconfig
        run: |
          aws eks update-kubeconfig --region me-south-1 --name rental-solutions-staging

      - name: 🚀 Deploy to staging
        run: |
          # Update image tags in deployment
          sed -i "s|image: registry.rental-solutions.com/rental-solutions/api:latest|image: registry.rental-solutions.com/rental-solutions/api:${{ env.IMAGE_TAG }}|g" k8s/staging/deployment.yaml
          sed -i "s|image: registry.rental-solutions.com/rental-solutions/web:latest|image: registry.rental-solutions.com/rental-solutions/web:${{ env.IMAGE_TAG }}|g" k8s/staging/deployment.yaml
          
          # Apply Kubernetes manifests
          kubectl apply -f k8s/staging/namespace.yaml
          kubectl apply -f k8s/staging/secrets.yaml
          kubectl apply -f k8s/staging/configmap.yaml
          kubectl apply -f k8s/staging/deployment.yaml
          kubectl apply -f k8s/staging/service.yaml
          kubectl apply -f k8s/staging/ingress.yaml
          kubectl apply -f k8s/staging/hpa.yaml
          
          # Wait for deployment to complete
          kubectl rollout status deployment/rental-solutions-api -n rental-solutions-staging --timeout=300s
          kubectl rollout status deployment/rental-solutions-web -n rental-solutions-staging --timeout=300s

  # 🧪 End-to-End Testing
  e2e-tests:
    name: 🧪 End-to-End Tests
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎭 Install Playwright browsers
        run: npx playwright install --with-deps

      - name: 🧪 Run E2E tests
        run: npm run test:e2e
        env:
          BASE_URL: https://staging.rental-solutions.qa

      - name: 📊 Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # 🚀 Deploy to Production
  deploy-production:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: [e2e-tests, build-images]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: 🔐 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: me-south-1

      - name: 🔧 Update kubeconfig
        run: |
          aws eks update-kubeconfig --region me-south-1 --name rental-solutions-production

      - name: 🚀 Deploy to production
        run: |
          # Update image tags in deployment
          sed -i "s|image: registry.rental-solutions.com/rental-solutions/api:latest|image: registry.rental-solutions.com/rental-solutions/api:${{ env.IMAGE_TAG }}|g" k8s/production/deployment.yaml
          sed -i "s|image: registry.rental-solutions.com/rental-solutions/web:latest|image: registry.rental-solutions.com/rental-solutions/web:${{ env.IMAGE_TAG }}|g" k8s/production/deployment.yaml
          
          # Apply Kubernetes manifests
          kubectl apply -f k8s/production/namespace.yaml
          kubectl apply -f k8s/production/secrets.yaml
          kubectl apply -f k8s/production/configmap.yaml
          kubectl apply -f k8s/production/deployment.yaml
          kubectl apply -f k8s/production/service.yaml
          kubectl apply -f k8s/production/ingress.yaml
          kubectl apply -f k8s/production/hpa.yaml
          
          # Wait for deployment to complete
          kubectl rollout status deployment/rental-solutions-api -n rental-solutions --timeout=600s
          kubectl rollout status deployment/rental-solutions-web -n rental-solutions --timeout=600s

      - name: 🧪 Production smoke tests
        run: |
          # Wait for services to be ready
          sleep 30
          
          # Test API health
          curl -f https://api.rental-solutions.qa/health || exit 1
          
          # Test web health  
          curl -f https://rental-solutions.qa/health || exit 1

  # 📊 Performance Testing
  performance-tests:
    name: 📊 Performance Tests
    runs-on: ubuntu-latest
    needs: deploy-production
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📊 Run performance tests
        run: npm run test:performance
        env:
          BASE_URL: https://rental-solutions.qa

      - name: 📈 Upload performance results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: performance-report
          path: performance-report/
          retention-days: 30

  # 📱 Mobile App Deployment
  deploy-mobile:
    name: 📱 Deploy Mobile App
    runs-on: ubuntu-latest
    needs: deploy-production
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Expo CLI
        run: npm install -g @expo/cli

      - name: 📱 Build and deploy mobile app
        run: |
          # This would be for a mobile app if we had one
          echo "Mobile app deployment would go here"

  # 📧 Notifications
  notifications:
    name: 📧 Notifications
    runs-on: ubuntu-latest
    needs: [deploy-production, performance-tests]
    if: always()
    steps:
      - name: 📧 Send deployment notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          text: |
            🚀 Production deployment completed!
            
            **Status**: ${{ job.status }}
            **Environment**: Production
            **Commit**: ${{ github.sha }}
            **Author**: ${{ github.actor }}
            **URL**: https://rental-solutions.qa
            
            📊 Performance metrics available in artifacts.
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: 📧 Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "🚀 Production Deployment - ${{ job.status }}"
          body: |
            Production deployment has completed with status: ${{ job.status }}
            
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            Time: ${{ github.event.head_commit.timestamp }}
            
            Application URL: https://rental-solutions.qa
            
            Check GitHub Actions for detailed logs.
          to: admin@rental-solutions.qa
          from: noreply@rental-solutions.qa 