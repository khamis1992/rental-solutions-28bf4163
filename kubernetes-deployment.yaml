---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rental-solutions-ingress
  namespace: rental-solutions
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - rental-solutions.qa
    - api.rental-solutions.qa
    secretName: rental-solutions-tls
  rules:
  - host: rental-solutions.qa
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: rental-solutions-web-service
            port:
              number: 80
  - host: api.rental-solutions.qa
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: rental-solutions-api-service
            port:
              number: 80

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rental-solutions-storage
  namespace: rental-solutions
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3
  resources:
    requests:
      storage: 20Gi

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rental-solutions-api-pdb
  namespace: rental-solutions
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: rental-solutions-api

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rental-solutions-web-pdb
  namespace: rental-solutions
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: rental-solutions-web

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rental-solutions-network-policy
  namespace: rental-solutions
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    - namespaceSelector:
        matchLabels:
          name: monitoring
  - from:
    - podSelector:
        matchLabels:
          app: rental-solutions-web
    ports:
    - protocol: TCP
      port: 3000
  egress:
  - to: []
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
  - to:
    - podSelector:
        matchLabels:
          app: rental-solutions-api
    ports:
    - protocol: TCP
      port: 3000 