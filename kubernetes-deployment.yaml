apiVersion: v1
kind: Namespace
metadata:
  name: rental-solutions
  labels:
    name: rental-solutions
    environment: production
    region: qatar

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rental-solutions-api
  namespace: rental-solutions
  labels:
    app: rental-solutions-api
    version: v1.0.0
    tier: backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: rental-solutions-api
  template:
    metadata:
      labels:
        app: rental-solutions-api
        version: v1.0.0
        tier: backend
    spec:
      containers:
      - name: api
        image: rental-solutions/api:latest
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: rental-solutions-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: rental-solutions-secrets
              key: redis-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: rental-solutions-secrets
              key: jwt-secret
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
            ephemeral-storage: 1Gi
          limits:
            cpu: 500m
            memory: 512Mi
            ephemeral-storage: 2Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: app-logs
          mountPath: /app/logs
        - name: config
          mountPath: /app/config
          readOnly: true
      volumes:
      - name: app-logs
        emptyDir: {}
      - name: config
        configMap:
          name: rental-solutions-config
      imagePullSecrets:
      - name: registry-credentials
      nodeSelector:
        kubernetes.io/arch: amd64
        node.kubernetes.io/instance-type: t3.medium
      tolerations:
      - key: "rental-solutions"
        operator: "Equal"
        value: "api"
        effect: "NoSchedule"

---
apiVersion: v1
kind: Service
metadata:
  name: rental-solutions-api-service
  namespace: rental-solutions
  labels:
    app: rental-solutions-api
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: rental-solutions-api

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rental-solutions-web
  namespace: rental-solutions
  labels:
    app: rental-solutions-web
    version: v1.0.0
    tier: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: rental-solutions-web
  template:
    metadata:
      labels:
        app: rental-solutions-web
        version: v1.0.0
        tier: frontend
    spec:
      containers:
      - name: web
        image: rental-solutions/web:latest
        ports:
        - containerPort: 80
          name: http
        env:
        - name: API_URL
          value: "http://rental-solutions-api-service"
        - name: ENVIRONMENT
          value: "production"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
            ephemeral-storage: 500Mi
          limits:
            cpu: 200m
            memory: 256Mi
            ephemeral-storage: 1Gi
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      imagePullSecrets:
      - name: registry-credentials

---
apiVersion: v1
kind: Service
metadata:
  name: rental-solutions-web-service
  namespace: rental-solutions
  labels:
    app: rental-solutions-web
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: rental-solutions-web

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rental-solutions-api-hpa
  namespace: rental-solutions
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rental-solutions-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Pods
        value: 2
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rental-solutions-web-hpa
  namespace: rental-solutions
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rental-solutions-web
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rental-solutions-config
  namespace: rental-solutions
data:
  app.properties: |
    # Rental Solutions Configuration
    app.name=Rental Solutions
    app.version=1.0.0
    app.environment=production
    app.region=qatar
    
    # Database Configuration
    db.pool.min=5
    db.pool.max=20
    db.timeout=30000
    
    # Cache Configuration
    cache.ttl=3600
    cache.maxSize=10000
    
    # Logging Configuration
    log.level=info
    log.format=json
    
    # Performance Configuration
    request.timeout=30000
    connection.timeout=5000
    
    # Security Configuration
    security.jwt.expiration=3600
    security.bcrypt.rounds=12
    
    # Qatar Specific Settings
    locale=ar-QA
    timezone=Asia/Qatar
    currency=QAR
    
  nginx.conf: |
    server {
        listen 80;
        server_name _;
        
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }
        
        location /api {
            proxy_pass http://rental-solutions-api-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        location /health {
            access_log off;
            return 200 "healthy\n";
        }
    }

